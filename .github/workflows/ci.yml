name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (.NET Framework build + unit tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: src/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: nuget restore src\ReinsuranceWorkbench.sln

      - name: Build
        run: msbuild src\ReinsuranceWorkbench.sln /t:Build /p:Configuration=Debug /v:minimal

      - name: Unit tests (excludes Integration)
        shell: pwsh
        run: |
          $vstest = & vswhere -latest -requires Microsoft.VisualStudio.Component.TestTools.BuildTools -find Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe
          if (-not $vstest) { $vstest = & vswhere -latest -find Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe }
          & $vstest src\Reinsurance.Tests\bin\Debug\Reinsurance.Tests.dll `
            /TestAdapterPath:src\packages\NUnit3TestAdapter.4.5.0\build\net462 `
            /Logger:console `
            "/TestCaseFilter:TestCategory!=Integration"
          exit $LASTEXITCODE

  web:
    name: web (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
